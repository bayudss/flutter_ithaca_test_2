<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperApps Nusaraya — Transportation Module</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui'], mono: ['JetBrains Mono','ui-monospace','monospace'] },
        colors: {
          brand: {50:'#EAF1F8',100:'#CFDDEC',200:'#9EBCDA',300:'#6E9BC7',400:'#4179AE',500:'#1F4E79',600:'#1A4267',700:'#143452',800:'#0F273E',900:'#0A1A29'},
          safety:{50:'#FEF4E5',100:'#FCE3BC',200:'#FACB87',300:'#F7B354',400:'#F5A529',500:'#F39800',600:'#CC7F00',700:'#A36500',800:'#7A4C00',900:'#523300'},
          success:{50:'#E8F6F0',100:'#CDEADC',500:'#1D9E75',600:'#178060',700:'#11624A'},
          warning:{50:'#FEF4DE',100:'#FBE3B0',500:'#EF9F27',600:'#C8821A',700:'#946011'},
          danger: {50:'#FBE8E8',100:'#F4C7C6',500:'#E24B4A',600:'#BE3A39',700:'#8E2A29'},
          info:   {50:'#E6F0FB',500:'#378ADD',600:'#2A6FB8',700:'#1F548B'},
        },
      }
    }
  }
</script>

<style>
  :root {
    --bg: #f5f6f8; --bg-elev: #fafafa; --surface: #ffffff;
    --border: #e6e8ec; --border-strong: #d0d4dc;
    --text: #0f1115; --text-muted: #5b6472; --text-subtle: #8b94a2;
    --ring: rgba(31,78,121,0.35);
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: 'Inter',ui-sans-serif,system-ui; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11','ss01','tnum'; }
  .surface { background: var(--surface); border: 1px solid var(--border); }
  .border-token { border-color: var(--border); }
  .border-token-strong { border-color: var(--border-strong); }
  .text-muted { color: var(--text-muted); }
  .text-subtle { color: var(--text-subtle); }
  .bg-elev { background: var(--bg-elev); }
  .mono { font-family: 'JetBrains Mono',ui-monospace,monospace; }

  .iphone-frame { width: 390px; height: 844px; border-radius: 56px; background: #0b0d12; padding: 12px; box-shadow: 0 0 0 2px #2b2f3a, 0 30px 60px -20px rgba(15,17,21,0.45), 0 10px 30px -10px rgba(15,17,21,0.25); position: relative; }
  .iphone-screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; }
  .iphone-notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 112px; height: 32px; border-radius: 24px; background: #0b0d12; z-index: 50; }
  .iphone-statusbar { height: 54px; padding: 18px 26px 0; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .iphone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.35); z-index: 50; }
  .iphone-screen.on-dark { color: #fff; }
  .iphone-screen.on-dark .iphone-statusbar { color: #fff; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #98a1b2; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.9s linear infinite; }
  @keyframes pulseDot { 0% { transform: scale(.7); opacity:.9 } 70% { transform: scale(2.5); opacity:0 } 100% { transform: scale(.7); opacity:0 } }
  .pulse-dot::after { content:''; position:absolute; inset:0; border-radius:50%; background: currentColor; animation: pulseDot 1.6s infinite; }
  @keyframes vehicleMove { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
  @keyframes routeDash { to { stroke-dashoffset: -16; } }
  .route-flow { stroke-dasharray: 8 8; animation: routeDash 0.8s linear infinite; }
  @keyframes alertBlink { 0%, 60% { opacity: 1; } 80%, 100% { opacity: 0.5; } }
  .alert-blink { animation: alertBlink 1.2s infinite; }
  @keyframes ping2 { 0% { transform: scale(1); opacity:0.5 } 100% { transform: scale(2.4); opacity:0 } }
  .ping-ring::after { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid currentColor; animation: ping2 1.8s ease-out infinite; }

  *:focus { outline: none; }
  .focus-ring:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
  .tab-active { color: #1F4E79; }
  .tab-active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: currentColor; border-radius: 2px 2px 0 0; }

  .anno { position: absolute; left: 100%; top: 36px; margin-left: 20px; width: 230px; padding: 10px 12px; background: #0F273E; color: #fff; border-radius: 10px; font-size: 11px; line-height: 1.45; box-shadow: 0 8px 24px -8px rgba(15,17,21,0.35); z-index: 5; }
  .anno::before { content: ''; position: absolute; left: -6px; top: 16px; border: 6px solid transparent; border-right-color: #0F273E; border-left: 0; }
  .anno .lab { display: inline-block; font-family: 'JetBrains Mono',monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; margin-bottom: 4px; }

  /* Map base */
  .map-bg { background-color: #e8eef4; background-image:
      repeating-linear-gradient(0deg, rgba(31,78,121,0.04) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(31,78,121,0.04) 0 1px, transparent 1px 40px);
  }
  .map-dark { background-color: #0d1520; background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px);
  }
</style>
</head>
<body class="font-sans">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="src/icon.jsx"></script>
<script type="text/babel" src="src/transport/shared.jsx"></script>
<script type="text/babel" src="src/transport/passenger.jsx"></script>
<script type="text/babel" src="src/transport/driver.jsx"></script>
<script type="text/babel" src="src/transport/web.jsx"></script>
<script type="text/babel" src="src/transport/liveops.jsx"></script>
<script type="text/babel" src="src/transport/main.jsx"></script>
</body>
</html>
