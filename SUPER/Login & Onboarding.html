<style>
  :root {
    --bg: #f5f6f8; --bg-elev: #fafafa; --surface: #ffffff;
    --border: #e6e8ec; --border-strong: #d0d4dc;
    --text: #0f1115; --text-muted: #5b6472; --text-subtle: #8b94a2;
    --ring: rgba(22,112,196,0.35);
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: 'Inter',ui-sans-serif,system-ui; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11','ss01'; }
  .surface { background: var(--surface); border: 1px solid var(--border); }
  .border-token { border-color: var(--border); }
  .border-token-strong { border-color: var(--border-strong); }
  .text-muted { color: var(--text-muted); }
  .text-subtle { color: var(--text-subtle); }
  .bg-elev { background: var(--bg-elev); }
  .mono { font-family: 'JetBrains Mono',ui-monospace,monospace; }

  /* Phone frame */
  .iphone-frame {
    width: 390px; height: 844px;
    border-radius: 56px;
    background: #0b0d12;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2b2f3a,
      0 30px 60px -20px rgba(15,17,21,0.45),
      0 10px 30px -10px rgba(15,17,21,0.25);
    position: relative;
  }
  .iphone-screen {
    width: 100%; height: 100%; border-radius: 44px;
    overflow: hidden; background: #fff; position: relative;
    display: flex; flex-direction: column;
  }
  .iphone-notch {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 32px; border-radius: 24px; background: #0b0d12;
    z-index: 50;
  }
  .iphone-statusbar {
    height: 54px; padding: 18px 26px 0; display: flex;
    align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; color: inherit;
    flex-shrink: 0;
    position: relative; z-index: 50;
  }
  .iphone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.35); z-index: 50; }

  /* For dark splash etc */
  .iphone-screen.on-dark { color: #fff; }
  .iphone-screen.on-dark .iphone-statusbar { color: #fff; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #98a1b2; }
  ::-webkit-scrollbar-track { background: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.9s linear infinite; }

  /* SOS pulse */
  @keyframes sosPulse {
    0%   { box-shadow: 0 0 0 0 rgba(226,75,74,0.6), 0 10px 30px rgba(226,75,74,0.35); }
    70%  { box-shadow: 0 0 0 22px rgba(226,75,74,0), 0 10px 30px rgba(226,75,74,0.35); }
    100% { box-shadow: 0 0 0 0 rgba(226,75,74,0), 0 10px 30px rgba(226,75,74,0.35); }
  }
  .sos-pulse { animation: sosPulse 1.8s infinite; }

  /* Blink for command center alert bar */
  @keyframes blink { 0%,60% { opacity: 1; } 80%,100% { opacity: 0.6; } }
  .alert-blink { animation: blink 1.2s infinite; }

  /* Splash gradient */
  .splash-bg {
    background:
      radial-gradient(120% 80% at 20% 10%, rgba(46,155,230,0.55) 0%, transparent 55%),
      radial-gradient(140% 80% at 90% 100%, rgba(46,155,230,0.22) 0%, transparent 60%),
      linear-gradient(180deg, #0A2E54 0%, #0F4C8A 38%, #1670C4 66%, #2E9BE6 100%);
  }

  /* Hide outline, custom focus */
  *:focus { outline: none; }
  .focus-ring:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

  /* Bar chart bars are simple divs */
  .bar { transition: height 200ms ease; }

  /* Pulse dot */
  @keyframes pulseDot { 0% { transform: scale(.7); opacity:.9 } 70% { transform: scale(2.5); opacity:0 } 100% { transform: scale(.7); opacity:0 } }
  .pulse-dot::after { content:''; position:absolute; inset:0; border-radius:50%; background: currentColor; animation: pulseDot 1.6s infinite; }

  /* tab underline */
  .tab-active { color: #1670C4; }
  .tab-active::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 2px; background: #1670C4; border-radius: 2px 2px 0 0;
  }
</style>
