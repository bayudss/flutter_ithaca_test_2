<head>
<meta charset="utf-8" />

<title>SuperApps Nusaraya — Catering / Mess Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter','ui-sans-serif','system-ui'],
          mono: ['JetBrains Mono','ui-monospace','monospace'],
        },
        colors: {
          brand: {50:'#EAF1F8',100:'#CFDDEC',200:'#9EBCDA',300:'#6E9BC7',400:'#4179AE',500:'#1F4E79',600:'#1A4267',700:'#143452',800:'#0F273E',900:'#0A1A29'},
          safety:{50:'#FEF4E5',100:'#FCE3BC',200:'#FACB87',300:'#F7B354',400:'#F5A529',500:'#F39800',600:'#CC7F00',700:'#A36500',800:'#7A4C00',900:'#523300'},
          success:{50:'#E8F6F0',100:'#CDEADC',500:'#1D9E75',600:'#178060',700:'#11624A'},
          warning:{50:'#FEF4DE',100:'#FBE3B0',500:'#EF9F27',600:'#C8821A',700:'#946011'},
          danger: {50:'#FBE8E8',100:'#F4C7C6',500:'#E24B4A',600:'#BE3A39',700:'#8E2A29'},
          info:   {50:'#E6F0FB',500:'#378ADD',600:'#2A6FB8',700:'#1F548B'},
          /* Catering palette — warm orange + earthy green */
          cater:  {50:'#FFF6E8',100:'#FDE6C0',200:'#FBD08A',300:'#F8B556',400:'#F39C2A',500:'#E68506',600:'#BA6A05',700:'#8B4F04'},
          herb:   {50:'#EEF5EA',100:'#D6E6CC',500:'#5C8C44',600:'#456A33',700:'#314D24'},
          cream:  {50:'#FBF7F1',100:'#F5EDDF',200:'#EBDDC2'},
        },
      }
    }
  }
</script>

<style>
  :root {
    --bg: #f5f6f8; --bg-elev: #fafafa; --surface: #ffffff;
    --border: #e6e8ec; --border-strong: #d0d4dc;
    --text: #0f1115; --text-muted: #5b6472; --text-subtle: #8b94a2;
    --ring: rgba(31,78,121,0.35);
    --cream: #FBF7F1;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: 'Inter',ui-sans-serif,system-ui; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11','ss01'; }
  .surface { background: var(--surface); border: 1px solid var(--border); }
  .border-token { border-color: var(--border); }
  .border-token-strong { border-color: var(--border-strong); }
  .text-muted { color: var(--text-muted); }
  .text-subtle { color: var(--text-subtle); }
  .bg-elev { background: var(--bg-elev); }
  .bg-cream { background: var(--cream); }
  .mono { font-family: 'JetBrains Mono',ui-monospace,monospace; }

  /* Phone frame */
  .iphone-frame {
    width: 390px; height: 844px; border-radius: 56px;
    background: #0b0d12; padding: 12px;
    box-shadow: 0 0 0 2px #2b2f3a, 0 30px 60px -20px rgba(15,17,21,0.45), 0 10px 30px -10px rgba(15,17,21,0.25);
    position: relative;
  }
  .iphone-screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; position: relative; display: flex; flex-direction: column; }
  .iphone-notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 112px; height: 32px; border-radius: 24px; background: #0b0d12; z-index: 50; }
  .iphone-statusbar { height: 54px; padding: 18px 26px 0; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .iphone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.35); z-index: 50; }
  .iphone-screen.on-dark { color: #fff; }
  .iphone-screen.on-dark .iphone-statusbar { color: #fff; }

  /* Tablet frame (for scanner console) */
  .tablet-frame {
    width: 1024px; height: 720px; border-radius: 28px;
    background: #0b0d12; padding: 14px;
    box-shadow: 0 0 0 2px #2b2f3a, 0 24px 60px -20px rgba(15,17,21,0.45);
  }
  .tablet-screen { width:100%; height:100%; border-radius:16px; overflow:hidden; background:#0b0d12; position:relative; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #98a1b2; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.9s linear infinite; }

  @keyframes pulseDot { 0% { transform: scale(.7); opacity:.9 } 70% { transform: scale(2.5); opacity:0 } 100% { transform: scale(.7); opacity:0 } }
  .pulse-dot::after { content:''; position:absolute; inset:0; border-radius:50%; background: currentColor; animation: pulseDot 1.6s infinite; }

  @keyframes qrPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(243,152,0,0.45); }
    50% { box-shadow: 0 0 0 14px rgba(243,152,0,0); }
  }
  .qr-pulse { animation: qrPulse 2.2s ease-in-out infinite; }

  @keyframes scanLine { 0% { transform: translateY(0); } 100% { transform: translateY(280px); } }
  .scan-line { animation: scanLine 2.4s ease-in-out infinite alternate; }

  @keyframes checkPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .check-pop { animation: checkPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }

  @keyframes ringExpand {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(2.5); opacity: 0; }
  }
  .ring-expand { animation: ringExpand 1.4s ease-out both; }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
  }
  .confetti { animation: confettiFall 2.2s ease-out infinite; }

  @keyframes shimmer { 0% { background-position: -400px 0 } 100% { background-position: 400px 0 } }
  .skeleton { background: linear-gradient(90deg, var(--bg-elev) 0%, var(--border) 40%, var(--bg-elev) 80%); background-size: 800px 100%; animation: shimmer 1.4s infinite linear; border-radius: 6px; }

  *:focus { outline: none; }
  .focus-ring:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

  /* Tab underline */
  .tab-active { color: #E68506; }
  .tab-active::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 2px; background: #E68506; border-radius: 2px 2px 0 0;
  }

  /* Annotation pill */
  .anno {
    position: absolute; left: 100%; top: 36px; margin-left: 20px;
    width: 230px; padding: 10px 12px; background: #0F273E; color: #fff;
    border-radius: 10px; font-size: 11px; line-height: 1.45;
    box-shadow: 0 8px 24px -8px rgba(15,17,21,0.35);
    z-index: 5;
  }
  .anno::before {
    content: ''; position: absolute; left: -6px; top: 16px;
    border: 6px solid transparent; border-right-color: #0F273E; border-left: 0;
  }
  .anno .lab { display: inline-block; font-family: 'JetBrains Mono',monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; margin-bottom: 4px; }

  /* Food placeholder gradients */
  .food-nasi-uduk { background:
    radial-gradient(circle at 30% 40%, #FFE9B0 0 22%, transparent 23%),
    radial-gradient(circle at 65% 35%, #C75D3A 0 12%, transparent 13%),
    radial-gradient(circle at 55% 70%, #8B5A2B 0 14%, transparent 15%),
    radial-gradient(circle at 78% 65%, #6A8E4A 0 9%, transparent 10%),
    linear-gradient(135deg, #C49563 0%, #8D6A3F 100%);
  }
  .food-ayam-bakar { background:
    radial-gradient(circle at 35% 45%, #F2EAD1 0 24%, transparent 25%),
    radial-gradient(circle at 65% 50%, #7A3F1A 0 18%, transparent 19%),
    radial-gradient(circle at 30% 75%, #4B7A2A 0 11%, transparent 12%),
    radial-gradient(circle at 80% 75%, #D08A00 0 8%, transparent 9%),
    linear-gradient(135deg, #B5793D 0%, #6B4220 100%);
  }
  .food-nasi-goreng { background:
    radial-gradient(circle at 50% 50%, #B05E1B 0 32%, transparent 33%),
    radial-gradient(circle at 35% 35%, #E2B43D 0 8%, transparent 9%),
    radial-gradient(circle at 60% 65%, #5C8B3B 0 9%, transparent 10%),
    radial-gradient(circle at 70% 35%, #C42E1D 0 7%, transparent 8%),
    linear-gradient(135deg, #8C4818 0%, #4D2810 100%);
  }
  .food-bubur { background:
    radial-gradient(circle at 50% 50%, #F5EFDF 0 38%, transparent 39%),
    radial-gradient(circle at 60% 40%, #C9A063 0 7%, transparent 8%),
    radial-gradient(circle at 40% 60%, #B5631F 0 6%, transparent 7%),
    radial-gradient(circle at 55% 65%, #5C8B3B 0 5%, transparent 6%),
    linear-gradient(135deg, #DBC598 0%, #8B6E3A 100%);
  }
  .food-buah { background:
    radial-gradient(circle at 30% 40%, #F2C84B 0 18%, transparent 19%),
    radial-gradient(circle at 65% 50%, #C42E1D 0 14%, transparent 15%),
    radial-gradient(circle at 50% 75%, #6A8E4A 0 12%, transparent 13%),
    radial-gradient(circle at 75% 30%, #D17B47 0 10%, transparent 11%),
    linear-gradient(135deg, #E8B47E 0%, #A66A3E 100%);
  }
</style>
</head>
